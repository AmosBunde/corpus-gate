# CorpusGate services. The contract for this file is README section 8:
# docker compose up --build on a clean machine serves the UI on :3000
# and the API on :8000 against the committed demo corpus.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-local}
      QDRANT_URL: http://vectordb:6333
      LLM_URL: http://llm:8080
      CORPUSGATE_API_TOKEN: ${CORPUSGATE_API_TOKEN:-change-me}
    depends_on:
      - vectordb
      - llm

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api

  vectordb:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # The pinned local runtime. Fetch the model once with
  # make fetch-model; the split GGUF loads from part one.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      [
        "-m", "/models/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf",
        "--port", "8080", "--host", "0.0.0.0", "--ctx-size", "4096",
      ]
    volumes:
      - ./models:/models:ro
    ports:
      - "${LLM_PORT:-8080}:8080"

volumes:
  qdrant_data:
